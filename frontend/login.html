<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login — StudySphere</title>
    <link rel="stylesheet" href="assets/ css/style.css">
</head>

<body>
    <main class="auth">
        <div class="auth-box"><a class="logo auth-logo" href="index.html">Study<span>Sphere</span></a>
            <h1>Welcome back</h1>
            <p class="muted center">Sign in to continue learning.</p>
            <form id="form">
                <div class="form-group"><label>Email</label><input id="email" class="input" type="email" required></div>
                <div class="form-group"><label>Password</label><input id="password" class="input" type="password"
                        required minlength="6"></div>
                <div id="error" class="error"></div><button class="btn btn-primary full">Login</button>
            </form>
            <p class="auth-switch">New to StudySphere? <a href="register.html"
                    style="color:var(--navy);font-weight:800">Create account</a></p>
            <p class="auth-switch"><a href="index.html">← Back to landing page</a></p>
        </div>
    </main>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/login.js"></script>
</body>

</html>
