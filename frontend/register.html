<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register — StudySphere</title>
    <link rel="stylesheet" href="assets/ css/style.css">
</head>

<body>
    <main class="auth">
        <div class="auth-box"><a class="logo auth-logo" href="index.html">Study<span>Sphere</span></a>
            <h1>Create your account</h1>
            <p class="muted center">Start your student learning journey.</p>
            <form id="form">
                <div class="form-group"><label>Full Name</label><input id="name" class="input" required></div>
                <div class="form-group"><label>Email</label><input id="email" class="input" type="email" required></div>
                <div class="form-group"><label>Password</label><input id="password" class="input" type="password"
                        minlength="6" required></div>
                <div class="form-group"><label>Confirm Password</label><input id="confirm" class="input" type="password"
                        required></div>
                <div id="error" class="error"></div><button class="btn btn-gold full">Create Account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html"
                    style="color:var(--navy);font-weight:800">Login</a></p>
            <p class="auth-switch"><a href="index.html">← Back to landing page</a></p>
        </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
