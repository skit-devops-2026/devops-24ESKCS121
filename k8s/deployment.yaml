apiVersion: apps/v1
kind: Deployment
metadata:
  name: studysphere
  namespace: studysphere
  labels:
    app: studysphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studysphere
  template:
    metadata:
      labels:
        app: studysphere
    spec:
      containers:
        - name: studysphere
          image: studysphere:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
